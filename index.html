<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0d0f0d" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Pre-paint theme application. Must run synchronously, before any CSS
      paints, so the correct theme is set on first frame (no light/dark
      flash). Mirrors src/config/theme.ts — keep both in sync.
    -->
    <script>
      (function () {
        try {
          var KEY = 'roam.theme.v1';
          var pref = 'system';
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed === 'dark' || parsed === 'light' || parsed === 'system') {
              pref = parsed;
            }
          }
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (systemDark ? 'dark' : 'light') : pref;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'light' ? '#f6f7f2' : '#0d0f0d');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!-- iOS PWA metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Roam" />

    <meta
      name="description"
      content="Explore a Street View panorama, guess where in the world you are, and score points based on distance."
    />

    <title>Roam — Geography Guessing Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
